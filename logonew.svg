<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8dc" />
      <stop offset="50%" stop-color="#faedcd" />
      <stop offset="100%" stop-color="#fefae0" />
    </linearGradient>

    <!-- Rich 3D Gold Gradient -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="25%" stop-color="#eacda3" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#aa771c" />
      <stop offset="100%" stop-color="#654321" />
    </linearGradient>

    <!-- Shiny Gold Highlights -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffd700" />
      <stop offset="70%" stop-color="#daa520" />
      <stop offset="100%" stop-color="#8b6508" />
    </linearGradient>

    <!-- Drop Shadows for 3D Relief -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#3b2204" flood-opacity="0.45"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Star Symbol Definition -->
    <g id="miniStar">
      <path d="M0,-10 L2.8,-3.1 L10,-2.5 L4.5,2.4 L6.2,9.5 L0,5.8 L-6.2,9.5 L-4.5,2.4 L-10,-2.5 L-2.8,-3.1 Z" fill="url(#goldShine)" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="1000" height="450" fill="url(#bgGrad)" />

  <!-- ==================== CROWN & HAND EMBLEM ==================== -->
  <g transform="translate(500, 105) scale(1.15)" filter="url(#dropShadow)">
    
    <!-- Glow behind top star -->
    <circle cx="0" cy="-68" r="22" fill="#ffea9f" opacity="0.6" filter="url(#glow)" />

    <!-- Crown Base / Headband -->
    <path d="M -85,15 C -40,32 40,32 85,15 C 80,38 -80,38 -85,15 Z" fill="url(#gold3D)" stroke="#fff" stroke-width="0.8" />
    <path d="M -82,22 C -40,38 40,38 82,22 C 40,30 -40,30 -82,22 Z" fill="#422405" />

    <!-- Crown Main Points -->
    <path d="M -78,16 
             C -85,-10 -65,-30 -55,-45 
             C -40,-20 -20,-35 0,-55 
             C 20,-35 40,-20 55,-45 
             C 65,-30 85,-10 78,16
             Z" 
          fill="url(#gold3D)" stroke="url(#goldShine)" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Crown Inner Shading / Ridges -->
    <path d="M 0,-55 L -10,-10 L 0,22 L 10,-10 Z" fill="#8c6218" opacity="0.4" />
    <path d="M -55,-45 L -45,-15 L -78,16 Z" fill="#654321" opacity="0.3" />
    <path d="M 55,-45 L 45,-15 L 78,16 Z" fill="#fff" opacity="0.2" />

    <!-- Crown Spheres on Tips -->
    <circle cx="-78" cy="16" r="4.5" fill="url(#goldShine)" />
    <circle cx="-55" cy="-45" r="5" fill="url(#goldShine)" />
    <circle cx="0" cy="-55" r="6" fill="url(#goldShine)" />
    <circle cx="55" cy="-45" r="5" fill="url(#goldShine)" />
    <circle cx="78" cy="16" r="4.5" fill="url(#goldShine)" />

    <!-- Top Star -->
    <g transform="translate(0, -68)">
      <path d="M0,-14 L3.8,-4.2 L14,-3.4 L6.2,3.3 L8.5,13 L0,7.8 L-8.5,13 L-6.2,3.3 L-14,-3.4 L-3.8,-4.2 Z" fill="url(#goldShine)" stroke="#fff" stroke-width="0.8" />
    </g>

    <!-- Mystical Hand Emerging from Crown Base (over 'e') -->
    <g transform="translate(0, 18)">
      <!-- Palm Base -->
      <rect x="-16" y="0" width="32" height="32" rx="4" fill="url(#gold3D)" stroke="#fff" stroke-width="1" />
      
      <!-- Fingers (vertical mystic bars) -->
      <rect x="-14" y="-28" width="4.5" height="32" rx="2.2" fill="url(#goldShine)" stroke="#654321" stroke-width="0.6" />
      <rect x="-7" y="-36" width="4.5" height="40" rx="2.2" fill="url(#goldShine)" stroke="#654321" stroke-width="0.6" />
      <rect x="0" y="-40" width="4.5" height="44" rx="2.2" fill="url(#goldShine)" stroke="#654321" stroke-width="0.6" />
      <rect x="7" y="-36" width="4.5" height="40" rx="2.2" fill="url(#goldShine)" stroke="#654321" stroke-width="0.6" />
      <rect x="14" y="-28" width="4.5" height="32" rx="2.2" fill="url(#goldShine)" stroke="#654321" stroke-width="0.6" />
      
      <!-- Glow light between fingers -->
      <ellipse cx="0" cy="-10" rx="12" ry="8" fill="#ffea9f" opacity="0.4" filter="url(#glow)" />
    </g>
  </g>


  <!-- ==================== MAIN TYPOGRAPHY: ASTROCELEBRITY ==================== -->
  <!-- We use high-end 3D layered text styling matching the reference image closely -->
  <g transform="translate(500, 275)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="96" filter="url(#dropShadow)">
    
    <!-- Back Outer Gold Stroke Layer (3D Extrusion Effect) -->
    <text x="0" y="0" letter-spacing="3" fill="url(#gold3D)" stroke="#4a2e0a" stroke-width="8" stroke-linejoin="round">astrocelebrity</text>

    <!-- Middle Dark Inner Core -->
    <text x="0" y="0" letter-spacing="3" fill="#18120b" stroke="#18120b" stroke-width="3">astrocelebrity</text>

    <!-- Top Highlight Gold Stroke & Gleam -->
    <text x="0" y="0" letter-spacing="3" fill="none" stroke="url(#goldShine)" stroke-width="2.5" stroke-linejoin="round">astrocelebrity</text>

  </g>

  <!-- Special touch: Star on top of the trailing 'y' -->
  <g transform="translate(830, 215)">
    <use href="#miniStar" transform="scale(1.4)" filter="url(#dropShadow)" />
  </g>


  <!-- ==================== SUBTITLE & DECORATIVE LINES ==================== -->
  <g transform="translate(500, 360)">
    <!-- Left Decorative Line with Accent Star -->
    <line x1="-420" y1="0" x2="-230" y2="0" stroke="url(#gold3D)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-425" cy="0" r="3" fill="url(#goldShine)" />

    <!-- Right Decorative Line with Accent Star -->
    <line x1="230" y1="0" x2="420" y2="0" stroke="url(#gold3D)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="425" cy="0" r="3" fill="url(#goldShine)" />

    <!-- Subtitle Text -->
    <text x="0" y="8" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-size="28" 
          font-weight="600" 
          letter-spacing="3.5" 
          text-anchor="middle" 
          fill="url(#gold3D)" 
          filter="url(#dropShadow)">
      cosmic guidance and star insights
    </text>
  </g>

  <!-- Ambient background magical stars -->
  <use href="#miniStar" x="120" y="100" transform="scale(0.8)" opacity="0.7" />
  <use href="#miniStar" x="880" y="120" transform="scale(0.6)" opacity="0.6" />
  <use href="#miniStar" x="200" y="400" transform="scale(0.5)" opacity="0.5" />
  <use href="#miniStar" x="800" y="390" transform="scale(0.7)" opacity="0.6" />
  <use href="#miniStar" x="500" y="420" transform="scale(0.4)" opacity="0.4" />

</svg>
