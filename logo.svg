<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <!-- Deep Rich Gold 3D Face Gradient -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF288" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Metallic Edge/Extrusion Gradient -->
    <linearGradient id="goldExtrusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B6508" />
      <stop offset="50%" stop-color="#654308" />
      <stop offset="100%" stop-color="#3A2503" />
    </linearGradient>

    <!-- Shimmer Highlight Gradient for Stars & Highlights -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- 3D Drop Shadow & Bevel Effects -->
    <filter id="true3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#1a1002" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="1" stdDeviation="0" flood-color="#FFF8DC" flood-opacity="0.9" />
    </filter>

    <filter id="glowOnly" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent Background Container -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Background Surrounding Stars with Glow -->
  <g filter="url(#glowOnly)">
    <!-- Star Top Left -->
    <path d="M 50,25 Q 50,33 42,33 Q 50,33 50,41 Q 50,33 58,33 Q 50,33 50,25 Z" fill="url(#shimmer)" />
    <!-- Star Far Left -->
    <circle cx="22" cy="75" r="1.5" fill="#FFFFFF" />
    <path d="M 22,68 Q 22,74 16,74 Q 22,74 22,80 Q 22,74 28,74 Q 22,74 22,68 Z" fill="url(#shimmer)" opacity="0.8"/>
    <!-- Star Bottom Left -->
    <path d="M 60,120 Q 60,126 54,126 Q 60,126 60,132 Q 60,126 66,126 Q 60,126 60,120 Z" fill="#FFE875" opacity="0.9"/>
    
    <!-- Star Top Right -->
    <path d="M 360,20 Q 360,27 353,27 Q 360,27 360,34 Q 360,27 367,27 Q 360,27 360,20 Z" fill="url(#shimmer)" />
    <!-- Star Far Right -->
    <path d="M 500,65 Q 500,71 494,71 Q 500,71 500,77 Q 500,71 506,71 Q 500,71 500,65 Z" fill="#FFE875" opacity="0.9"/>
    <!-- Star Bottom Right -->
    <path d="M 410,125 Q 410,132 403,132 Q 410,132 410,139 Q 410,132 417,132 Q 410,132 410,125 Z" fill="url(#shimmer)" opacity="0.85"/>
  </g>

  <!-- Central 3D Celestial Emblem -->
  <g transform="translate(80, 75)" filter="url(#true3D)">
    <!-- 3D Orbit Back Rings -->
    <ellipse cx="0" cy="0" rx="46" ry="15" fill="none" stroke="url(#goldExtrusion)" stroke-width="3" transform="rotate(-28)" />
    <ellipse cx="0" cy="0" rx="46" ry="15" fill="none" stroke="url(#goldFace)" stroke-width="1.5" transform="rotate(-28)" />

    <!-- 3D Extrusion Layers (Creates the physical depth/thickness) -->
    <g transform="translate(3, 4)" opacity="0.9">
      <path d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z" fill="url(#goldExtrusion)" />
      <path d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z" fill="url(#goldExtrusion)" transform="rotate(45)" />
    </g>

    <!-- Main Front Star Faces -->
    <path d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z" fill="url(#goldFace)" stroke="#FFF288" stroke-width="0.75" />
    <path d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z" fill="url(#goldFace)" stroke="#FFF288" stroke-width="0.75" transform="rotate(45)" />

    <!-- Brilliant Center Diamond Core -->
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFBE6" filter="url(#glowOnly)" />
  </g>

  <!-- 3D Extruded & Beveled Typography Section -->
  <g transform="translate(145, 0)">
    <!-- 3D Shadow/Extrusion Layer for Brand Name -->
    <text x="3" y="65" 
          font-family="Georgia, serif" 
          font-size="34" 
          font-weight="bold" 
          letter-spacing="4" 
          fill="url(#goldExtrusion)">ASTROCELEBRITY</text>

    <!-- Main Front Face Layer for Brand Name -->
    <text x="0" y="62" 
          font-family="Georgia, serif" 
          font-size="34" 
          font-weight="bold" 
          letter-spacing="4" 
          fill="url(#goldFace)" 
          filter="url(#true3D)">ASTROCELEBRITY</text>
    
    <!-- 3D Beveled Divider Rule -->
    <line x1="2" y1="78" x2="340" y2="78" stroke="#3A2503" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="76" x2="340" y2="76" stroke="url(#goldFace)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Tagline with 3D Shadow -->
    <text x="2.5" y="103" 
          font-family="Georgia, serif" 
          font-size="11.5" 
          font-weight="bold" 
          letter-spacing="2.8" 
          fill="#3A2503">COSMIC GUIDANCE &amp; STAR INSIGHTS</text>
    <text x="2" y="101" 
          font-family="Georgia, serif" 
          font-size="11.5" 
          font-weight="bold" 
          letter-spacing="2.8" 
          fill="url(#goldFace)">COSMIC GUIDANCE &amp; STAR INSIGHTS</text>
  </g>
</svg>
